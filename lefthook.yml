min_version: 2.0.5

# Shared hooks: data file guard, large files, commit size, commit message.
# Change git_url and ref to use another source or pin a version.
remotes:
  - git_url: https://github.com/aktin/aktin-github-scripts
    ref: main
    refetch_frequency: 24h
    configs:
      - hooks/lefthook.yml

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,vue,js,mjs,cjs}"
      run: PATH="$HOME/.bun/bin:$PATH" bunx eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,vue,js,mjs,cjs,json,md,yml,yaml,css}"
      run: PATH="$HOME/.bun/bin:$PATH" bunx prettier --write {staged_files}
      stage_fixed: true
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --verbose
        else
          echo "gitleaks not installed, skipping secret scan"
        fi

pre-push:
  commands:
    typecheck:
      run: PATH="$HOME/.bun/bin:$PATH" bun run typecheck
    test:
      run: PATH="$HOME/.bun/bin:$PATH" bun run test
    build:
      run: PATH="$HOME/.bun/bin:$PATH" bun run build
